name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["legacy/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Линтеры и unit-тесты
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Инструменты
        run: |
          pip install pytest==8.3.3 shellcheck-py==0.11.0.1 shfmt-py==4.2.0
          sudo apt-get update -q && sudo apt-get install -y -q bats qrencode
      - name: shellcheck
        run: cd stealthnode && shellcheck -x -S style install.sh uninstall.sh bin/stealthnode
      - name: shfmt
        run: shfmt -i 4 -ci -sr -d stealthnode/install.sh stealthnode/uninstall.sh stealthnode/lib/*.sh stealthnode/bin/stealthnode
      - name: pytest
        run: python -m pytest -q tests/unit
      - name: bats
        run: bats tests/bats

  e2e-install:
    name: Полная установка на Ubuntu 24.04 + doctor --e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Установка StealthNode (tls internal, без apt upgrade)
        run: |
          sudo bash stealthnode/install.sh --domain vpn.example.test --tls internal --skip-upgrade \
            --no-auto-reboot --user mama:50:2 --user papa:30:1 --no-doctor
      - name: doctor --e2e
        run: sudo stealthnode doctor --e2e --speed
      - name: Управление пользователями
        run: |
          set -x
          sudo stealthnode user add test1 --gb 1 --ip 1
          sudo stealthnode user list
          sudo stealthnode user limit test1 --gb 2 --ip 2
          sudo stealthnode user show test1
          sudo stealthnode user del test1 --yes
          sudo stealthnode user list
      - name: Повторный запуск установщика (идемпотентность)
        run: |
          sudo bash stealthnode/install.sh --tls internal --skip-upgrade --no-auto-reboot --no-doctor
          sudo stealthnode doctor --e2e
      - name: Резервная копия и восстановление
        run: |
          set -x
          sudo stealthnode backup
          f=$(sudo sh -c 'ls -1t /opt/stealthnode/backups/stealthnode-*.tar.gz | head -n1')
          sudo tar -tzf "$f"
          sudo stealthnode restore "$f"
          sudo stealthnode doctor --e2e
      - name: Контракт API 3x-ui и ссылки
        run: sudo python3 tests/ci/contract_check.py
      - name: Журналы при ошибке
        if: failure()
        run: |
          set +e
          sudo tail -n 200 /var/log/stealthnode/install-*.log
          sudo systemctl --no-pager status x-ui caddy fail2ban dnscrypt-proxy.socket
          sudo journalctl -u x-ui --no-pager -n 150
          sudo journalctl -u caddy --no-pager -n 80
          sudo journalctl -u fail2ban --no-pager -n 50
          sudo tail -n 100 /var/log/x-ui/3xui.log
          sudo cat /etc/caddy/Caddyfile
          sudo ss -lntup
          sudo ufw status verbose
          sudo fail2ban-client status
