name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["legacy/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-and-unit:
    name: Линтеры и unit-тесты
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Инструменты
        run: |
          pip install pytest==8.3.3 shellcheck-py==0.11.0.1 shfmt-py==4.2.0
          sudo apt-get update -q && sudo apt-get install -y -q bats qrencode
      - name: shellcheck
        run: cd stealthnode && shellcheck -x -S style install.sh uninstall.sh bin/stealthnode ../tests/ci/annotate.sh
      - name: shfmt
        run: shfmt -i 4 -ci -sr -d stealthnode/install.sh stealthnode/uninstall.sh stealthnode/lib/*.sh stealthnode/bin/stealthnode tests/ci/annotate.sh
      - name: pytest
        run: python -m pytest -q tests/unit
      - name: bats
        run: bats tests/bats

  protocols:
    name: E2E протоколов (Xray 26.10.10 + Hysteria 2.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Ядра Xray и Hysteria2 (сборки с PyPI)
        run: pip install pytest==8.3.3 xray-core==1.8.26.13 hysteria2==2.13.0
      - name: pytest tests/e2e
        run: python -m pytest -v tests/e2e 2>&1 | tee /tmp/protocols.log
      - name: Аннотации
        if: always()
        run: bash tests/ci/annotate.sh notice protocols /tmp/protocols.log 60 300

  e2e-install:
    name: Полная установка на Ubuntu 24.04 + doctor --e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Установка StealthNode (tls internal, без apt upgrade)
        run: |
          mkdir -p /tmp/ci
          sudo bash stealthnode/install.sh --domain vpn.example.test --tls internal --skip-upgrade \
            --no-auto-reboot --user mama:50:2 --user papa:30:1 --no-doctor 2>&1 | tee /tmp/ci/1-install.log
      - name: doctor --e2e
        run: sudo stealthnode doctor --e2e --speed 2>&1 | tee /tmp/ci/2-doctor.log
      - name: Контракт API 3x-ui и ссылки
        run: sudo python3 tests/ci/contract_check.py 2>&1 | tee /tmp/ci/3-contract.log
      - name: Управление пользователями
        run: |
          {
            set -x
            sudo stealthnode user add test1 --gb 1 --ip 1
            sudo stealthnode user list
            sudo stealthnode user limit test1 --gb 2 --ip 2
            sudo stealthnode user show test1
            sudo stealthnode user del test1 --yes
            sudo stealthnode user list
          } 2>&1 | tee /tmp/ci/4-users.log
      - name: Повторный запуск установщика (идемпотентность)
        run: |
          sudo bash stealthnode/install.sh --tls internal --skip-upgrade --no-auto-reboot --no-doctor 2>&1 | tee /tmp/ci/5-reinstall.log
          sudo stealthnode doctor --e2e 2>&1 | tee -a /tmp/ci/5-reinstall.log
      - name: Резервная копия и восстановление
        run: |
          {
            set -x
            sudo stealthnode backup
            f=$(sudo sh -c 'ls -1t /opt/stealthnode/backups/stealthnode-*.tar.gz | head -n1')
            sudo tar -tzf "$f"
            sudo stealthnode restore "$f"
            sudo stealthnode doctor --e2e
          } 2>&1 | tee /tmp/ci/6-backup.log
      - name: Диагностика
        if: always()
        run: |
          set +e
          {
            sudo systemctl --no-pager status x-ui caddy fail2ban dnscrypt-proxy.socket
            sudo journalctl -u x-ui --no-pager -n 80
            sudo journalctl -u caddy --no-pager -n 40
            sudo journalctl -u dnscrypt-proxy -u dnscrypt-proxy.socket --no-pager -n 40
            dnscrypt-proxy -version
            sudo tail -n 60 /var/log/x-ui/3xui.log
            sudo cat /etc/caddy/Caddyfile
            sudo ss -lntup
            sudo ufw status verbose
            sudo fail2ban-client status
          } > /tmp/ci/9-system.log 2>&1
          last=$(ls -1 /tmp/ci/*.log | grep -v 9-system | tail -n1)
          bash tests/ci/annotate.sh notice "$(basename "$last")" "$last" 50 500
          bash tests/ci/annotate.sh warning system /tmp/ci/9-system.log 60 600
