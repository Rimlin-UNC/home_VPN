# ============================================================
# StealthNode — конфигурация dnscrypt-proxy 2.1.18.
# Резолвер слушает внутреннюю docker-сеть; запросы VPN-клиентов
# попадают сюда через DNAT-перехват (см. entrypoint amneziawg).
# ============================================================

# Слушаем все интерфейсы контейнера (трафик только из stealthnet)
listen_addresses = ['0.0.0.0:53']
max_clients = 250

# Какие серверы используем (IPv4-only: у VPS чаще всего нет рабочего IPv6)
ipv4_servers = true
ipv6_servers = false
dnscrypt_servers = true
doh_servers = true

# Требования к апстримам: без логов, без фильтрации
require_dnssec = false
require_nolog = true
require_nofilter = true

# Явно выбранные серверы (из публичного списка; nolog + nofilter)
server_names = ['scaleway-fr', 'cloudflare', 'cloudflare-security']

# Отключить автоматический выбор самых быстрых? Нет — пусть выбирает лучший
lb_strategy = 'p2'

# Кэширование
cache = true
cache_size = 4096
cache_min_ttl = 2400
cache_max_ttl = 86400
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600

# Безопасность/совместимость
force_tcp = false
timeout = 5000
keepalive = 30
edns_client_subnet = []
# Не отключаем DNSSEC-валидацию апстрима, но и не требуем от клиента
refused_code_in_responses = false

# Логи (минимум; общий лог смотрим через docker logs)
log_level = 2
use_syslog = false

# Источники списков публичных резолверов (обновляются автоматически)
[sources]
  [sources.'public-resolvers']
  urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md', 'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md']
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  cache_file = 'public-resolvers.md'
  refresh_delay = 72
  prefix = ''

  [sources.'relays']
  urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/relays.md', 'https://download.dnscrypt.info/resolvers-list/v3/relays.md']
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  cache_file = 'relays.md'
  refresh_delay = 72
  prefix = ''
