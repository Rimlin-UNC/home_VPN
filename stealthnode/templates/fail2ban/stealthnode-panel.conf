# StealthNode: неудачные входы в панель 3x-ui v3.
# Строка журнала (internal/web/controller/index.go):
#   2026/10/14 12:34:56 WARNING - failed login: username="admin", IP="203.0.113.7", reason="..."
# Имя пользователя экранируется (%q), поэтому подставить чужой IP через логин нельзя.

[Definition]
datepattern = ^%%Y/%%m/%%d %%H:%%M:%%S
failregex = ^\s*WARNING - failed login: username=".*", IP="<ADDR>", reason=
ignoreregex =
