# StealthNode: неудачные входы в панель 3x-ui v3.
# Строки журнала (internal/web/controller/index.go):
#   2026/10/14 12:34:56 WARNING - failed login: username="admin", IP="203.0.113.7", reason="invalid credentials"
#   ... reason="too many failed attempts", blocked_until=2026-10-14T12:49:58Z
# Второй вид — отказ встроенного лимита 3x-ui (5 ошибок за 5 минут → 15 минут): пароль при этом
# даже не проверяется, поэтому такие строки не считаем — иначе верный пароль, введённый во время
# блокировки, тоже шёл бы в зачёт бана.
# Имя пользователя экранируется (%q), поэтому подставить через логин чужой IP или ложную
# причину «too many failed attempts» нельзя (ignoreregex привязан к концу строки).

[Definition]
datepattern = ^%%Y/%%m/%%d %%H:%%M:%%S
failregex = ^\s*WARNING - failed login: username=".*", IP="<ADDR>", reason=
ignoreregex = , reason="too many failed attempts", blocked_until=\S+\s*$
