# StealthNode: dnscrypt-proxy — шифрованный DNS для Xray.
# Слушает 127.0.2.1:53 через systemd socket activation (dnscrypt-proxy.socket),
# поэтому listen_addresses пуст. Системный резолвер сервера не меняется.

listen_addresses = []
max_clients = 250

# Только IPv4-резолверы без логов и фильтрации, с DNSSEC; DNSCrypt и DoH.
ipv4_servers = true
ipv6_servers = false
dnscrypt_servers = true
doh_servers = true
require_dnssec = true
require_nolog = true
require_nofilter = true

# Серверы выбираются автоматически из списка public-resolvers (самые быстрые).
lb_strategy = 'p2'

force_tcp = false
timeout = 5000
keepalive = 30

# Для первичной загрузки списка резолверов и проверки сети.
# fallback_resolvers понимают и старые (2.0.x, Ubuntu), и новые (2.1+) версии dnscrypt-proxy.
fallback_resolvers = ['9.9.9.9:53', '1.1.1.1:53']
ignore_system_dns = true
netprobe_target = '9.9.9.9:53'
netprobe_timeout = 60

block_ipv6 = false

cache = true
cache_size = 4096
cache_min_ttl = 600
cache_max_ttl = 86400
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600

log_level = 2
use_syslog = true

[sources]
  [sources.'public-resolvers']
    urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md', 'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md']
    cache_file = '/var/cache/dnscrypt-proxy/public-resolvers.md'
    minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
    refresh_delay = 72
    prefix = ''
